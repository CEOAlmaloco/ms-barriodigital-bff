openapi: 3.0.3
info:
  title: ms-barriodigital-bff
  version: 1.0.0
servers:
  - url: /
paths:
  /api/ping:
    get:
      operationId: ping
      responses:
        '200':
          description: OK
  /api/requests:
    get:
      operationId: listRequests
      responses:
        '200':
          description: OK
    post:
      operationId: createRequest
      responses:
        '200':
          description: OK
  /api/requests/{id}:
    get:
      operationId: getRequest
      responses:
        '200':
          description: OK
  /api/requests/{id}/status:
    put:
      operationId: updateStatus
      responses:
        '200':
          description: OK
  /api/catalog/procedures:
    get:
      operationId: listProcedures
      responses:
        '200':
          description: OK
    post:
      operationId: createProcedure
      responses:
        '200':
          description: OK
  /api/report/{proxy+}:
    get:
      operationId: reportProxy
      responses:
        '200':
          description: OK
  /api/audit/{proxy+}:
    get:
      operationId: auditProxy
      responses:
        '200':
          description: OK
  /api/mq/{proxy+}:
    get:
      operationId: mqProxy
      responses:
        '200':
          description: OK
  /api/kafka/{proxy+}:
    get:
      operationId: kafkaProxy
      responses:
        '200':
          description: OK
